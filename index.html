<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Colon-Movies — Cinematic Movie Encyclopedia & Watchlists</title>
  <meta name="description" content="Discover, search and track movies with ratings, trailers, cast lists, and personal watchlists." />
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Rajdhani:wght@600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="ambient-glow">
    <div class="orb-1"></div>
    <div class="orb-2"></div>
  </div>

  <!-- Hero Section -->
  <section class="hero-slider" id="heroSection">
    <div class="skeleton-box" style="width:100%;height:100%;position:absolute;"></div>
  </section>

  <!-- Main Content Wrap -->
  <main class="section-wrap">
    <div class="section-header">
      <div>
        <h2 class="section-title">Explore Movies</h2>
        <p class="section-subtitle" id="movieCount">Browse the highest-rated blockbusters & critical darlings</p>
      </div>
    </div>

    <!-- Genre Filter Tabs -->
    <div class="genre-filter-bar" id="genrePills"></div>

    <!-- Movies Grid -->
    <div class="movies-grid" id="moviesGrid">
      <div class="skeleton-box" style="aspect-ratio:2/3;"></div>
      <div class="skeleton-box" style="aspect-ratio:2/3;"></div>
      <div class="skeleton-box" style="aspect-ratio:2/3;"></div>
      <div class="skeleton-box" style="aspect-ratio:2/3;"></div>
    </div>
  </main>

  <!-- Footer -->
  <footer class="site-footer">
    <div class="footer-inner">
      <div>© 2026 <strong>Colon-Movies</strong>. Built for film lovers worldwide.</div>
      <div class="footer-links">
        <a href="index.html">Explore</a>
        <a href="profile.html">Watchlist</a>
        <a href="about.html">About</a>
      </div>
    </div>
  </footer>

  <script src="js/movieData.js"></script>
  <script src="js/movieApi.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/nav.js"></script>
  <script src="js/home.js"></script>
</body>
</html>
