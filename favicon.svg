<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="redGrad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ff1a2a"/>
      <stop offset="1" stop-color="#800008"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <rect width="64" height="64" rx="16" fill="#09090c"/>
  <rect x="2" y="2" width="60" height="60" rx="14" stroke="url(#redGrad)" stroke-width="2"/>
  <!-- Film Reel / Clapperboard Icon -->
  <circle cx="32" cy="32" r="20" fill="none" stroke="url(#redGrad)" stroke-width="4" filter="url(#glow)"/>
  <circle cx="32" cy="32" r="6" fill="#ff1a2a"/>
  <!-- Holes in reel -->
  <circle cx="32" cy="19" r="3" fill="#ff1a2a"/>
  <circle cx="32" cy="45" r="3" fill="#ff1a2a"/>
  <circle cx="19" cy="32" r="3" fill="#ff1a2a"/>
  <circle cx="45" cy="32" r="3" fill="#ff1a2a"/>
</svg>