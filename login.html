<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign In — Colon-Movies</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Rajdhani:wght@600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="ambient-glow">
    <div class="orb-1"></div>
    <div class="orb-2"></div>
  </div>

  <div class="auth-page-wrap">
    <div class="auth-card">
      <div style="display:flex;align-items:center;gap:10px;margin-bottom:14px;">
        <div style="font-size:1.8rem;">🎬</div>
        <span style="font-family:var(--font-display);font-size:1.5rem;font-weight:800;color:var(--red-bright);">COLON-MOVIES</span>
      </div>

      <h2>Welcome Back</h2>
      <p class="subtitle">Access your personal watchlist and movie ratings</p>

      <div class="form-error" id="loginError"></div>
      <div class="form-success" id="loginSuccess"></div>

      <form id="loginForm">
        <div class="form-group">
          <label for="email">Email or Username</label>
          <input type="text" id="email" class="form-input" placeholder="e.g. nolan@example.com" required autocomplete="username" />
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" class="form-input" placeholder="••••••••" required autocomplete="current-password" />
        </div>

        <button type="submit" class="btn btn-primary btn-block btn-lg" style="margin-top:12px;">Sign In →</button>
      </form>

      <div style="margin-top:24px;text-align:center;font-size:0.92rem;color:var(--text-muted);">
        Don't have an account? <a href="register.html" style="color:var(--red-bright);font-weight:600;">Create one for free</a>
      </div>
    </div>
  </div>

  <script src="js/auth.js"></script>
  <script>
    if (Auth.isLoggedIn()) window.location.href = "/profile.html";

    document.getElementById("loginForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const errEl = document.getElementById("loginError");
      const succEl = document.getElementById("loginSuccess");
      const email = document.getElementById("email").value.trim();
      const pass = document.getElementById("password").value;

      errEl.classList.remove("show");
      succEl.textContent = "Authenticating with cloud...";
      succEl.classList.add("show");

      const res = await Auth.login(email, pass);
      if (res.success) {
        succEl.textContent = "Login successful! Redirecting...";
        setTimeout(() => { window.location.href = "/profile.html"; }, 800);
      } else {
        succEl.classList.remove("show");
        errEl.textContent = res.message || "Invalid credentials.";
        errEl.classList.add("show");
      }
    });
  </script>
</body>
</html>
